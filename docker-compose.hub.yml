# Toată aplicația din imaginile publicate în Docker Hub, cu un PostgreSQL inclus.
#
# Toate variabilele stau aici, ca în Coolify să apară în „Environment Variables”:
#   ${VAR:?...}  obligatorie — fără ea stack-ul nu pornește
#   ${VAR:-x}    opțională, cu valoarea implicită x
#   ${VAR:-}     opțională, goală implicit (funcția respectivă rămâne oprită)
#
# Imaginile sunt pe Docker Hub (cezarique/…), publicate de CI doar ca `sha-<commit>` (nu există
# `latest`). Pentru o versiune nouă se schimbă BACKEND_TAG / FRONTEND_TAG / VALIDATOR_TAG.
#
# Local: docker compose -f docker-compose.hub.yml --env-file .env.hub up -d
#
# Imaginea de frontend are adresa API-ului coaptă la build în CI (`VITE_API_BASE_URL`); nu se poate
# schimba la rulare. Frontendul de aici vorbește cu API-ul cu care a fost construit.
name: ridelance-hub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ridelance}
      POSTGRES_USER: ${POSTGRES_USER:-ridelance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Setează POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  validator:
    image: cezarique/ridelance-validator:${VALIDATOR_TAG:-sha-22df4312e302}
    environment:
      PORT: "8080"
      INTERNAL_TOKEN: ${ANAF_VALIDATOR_TOKEN:?Setează ANAF_VALIDATOR_TOKEN}
      RUNNER_TIMEOUT_SECONDS: ${RUNNER_TIMEOUT_SECONDS:-60}
      RUNNER_MAX_CONCURRENT: ${RUNNER_MAX_CONCURRENT:-2}
    volumes:
      # Kitul de validare ANAF (DUKIntegrator și validatoarele) nu e în imagine.
      - ${ANAF_VALIDATORS_PATH:-./backend-anaf/validators}:/validators:ro
    restart: unless-stopped

  backend:
    image: cezarique/ridelance-backend:${BACKEND_TAG:-sha-89d7fdf4afd6}
    depends_on:
      postgres:
        condition: service_healthy
      validator:
        condition: service_started
    environment:
      # ─── Bază ───────────────────────────────────────────────────────────────────────────
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ridelance};Username=${POSTGRES_USER:-ridelance};Password=${POSTGRES_PASSWORD}
      # Adresa publică a frontendului: linkuri din emailuri, redirecturi Stripe/ANAF, CORS.
      App__BaseUrl: ${APP_BASE_URL:?Setează APP_BASE_URL (ex. https://ridelance.ro)}
      FileStorage__BasePath: /app/uploads

      # ─── Securitate ─────────────────────────────────────────────────────────────────────
      Jwt__Secret: ${JWT_SECRET:?Setează JWT_SECRET (openssl rand -base64 48)}
      Jwt__Issuer: ${JWT_ISSUER:-ridelance}
      Jwt__Audience: ${JWT_AUDIENCE:-ridelance-frontend}
      Jwt__ExpirationInMinutes: ${JWT_EXPIRATION_MINUTES:-15}
      # Criptează documentele și secretele. Nu se mai schimbă după primul upload.
      Encryption__Key: ${ENCRYPTION_KEY:?Setează ENCRYPTION_KEY (openssl rand -base64 32)}
      # Primul admin: link de creare a contului, trimis pe email și scris în log, doar cât nu există niciun admin.
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # Urgență: șterge 2FA-ul contului de echipă cu adresa asta la pornire. Se scoate după folosire.
      Security__ResetTwoFactorEmail: ${RESET_TWO_FACTOR_EMAIL:-}
      Cars__ViewSalt: ${CARS_VIEW_SALT:-}

      # ─── Onboarding (uneltele de test rămân oprite în producție) ────────────────────────
      Onboarding__EnableTestSkip: ${ONBOARDING_ENABLE_TEST_SKIP:-false}
      Onboarding__DevTools__Enabled: ${ONBOARDING_DEV_TOOLS:-false}
      Onboarding__AutoApproveDocuments: ${ONBOARDING_AUTO_APPROVE_DOCUMENTS:-false}
      Onboarding__RequireContactVerification: ${ONBOARDING_REQUIRE_CONTACT_VERIFICATION:-false}

      # ─── Email (Resend) ─────────────────────────────────────────────────────────────────
      Resend__ApiKey: ${RESEND_API_KEY:-}

      # ─── Plăți (Stripe) ─────────────────────────────────────────────────────────────────
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:?Setează STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:?Setează STRIPE_WEBHOOK_SECRET}

      # ─── AI (OpenRouter): citirea documentelor și verificarea actelor ───────────────────
      OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-}
      OpenRouter__Model: ${OPENROUTER_MODEL:-google/gemini-3.8-flash}
      OpenRouter__ReasoningEffort: ${OPENROUTER_REASONING_EFFORT:-low}
      OpenRouter__DocumentReasoningEffort: ${OPENROUTER_DOCUMENT_REASONING_EFFORT:-medium}

      # ─── ANAF ───────────────────────────────────────────────────────────────────────────
      AnafValidator__BaseUrl: http://validator:8080
      AnafValidator__Token: ${ANAF_VALIDATOR_TOKEN}
      AnafValidator__TimeoutSeconds: ${ANAF_VALIDATOR_TIMEOUT_SECONDS:-90}
      AnafOAuth__ClientId: ${ANAF_OAUTH_CLIENT_ID:-}
      AnafOAuth__ClientSecret: ${ANAF_OAUTH_CLIENT_SECRET:-}
      AnafOAuth__RedirectUri: ${ANAF_OAUTH_REDIRECT_URI:-https://api.ridelance.ro/anaf/oauth/callback}
      # Mandatarul din împuternicirea ANAF generată la pasul fiscal. Gol = apare la admin ca „lipsește”.
      AnafMandatar__FullName: ${ANAF_MANDATAR_FULL_NAME:-}
      AnafMandatar__Cnp: ${ANAF_MANDATAR_CNP:-}
      AnafMandatar__Domicile: ${ANAF_MANDATAR_DOMICILE:-}
      AnafMandatar__IdSeries: ${ANAF_MANDATAR_ID_SERIES:-}
      AnafMandatar__IdNumber: ${ANAF_MANDATAR_ID_NUMBER:-}
      AnafMandatar__Email: ${ANAF_MANDATAR_EMAIL:-}

      # ─── Facturare (Oblio) ──────────────────────────────────────────────────────────────
      Oblio__ClientId: ${OBLIO_CLIENT_ID:-}
      Oblio__ClientSecret: ${OBLIO_CLIENT_SECRET:-}
      Oblio__Cif: ${OBLIO_CIF:-}
      Oblio__SeriesName: ${OBLIO_SERIES_NAME:-}
      Oblio__SendToSpv: ${OBLIO_SEND_TO_SPV:-false}

      # ─── Open Banking (SmartAccounts) ───────────────────────────────────────────────────
      SmartAccounts__ClientId: ${SMARTACCOUNTS_CLIENT_ID:-}
      SmartAccounts__ApiBaseUrl: ${SMARTACCOUNTS_API_BASE_URL:-https://api.sandboxaccounts.smartfintech.eu}
      SmartAccounts__MtlsBaseUrl: ${SMARTACCOUNTS_MTLS_BASE_URL:-https://mtls.sandboxaccounts.smartfintech.eu}
      # Certificatul mTLS și cheia, ca text PEM (cu rândurile păstrate).
      SmartAccounts__CertificatePem: ${SMARTACCOUNTS_CERTIFICATE_PEM:-}
      SmartAccounts__PrivateKeyPem: ${SMARTACCOUNTS_PRIVATE_KEY_PEM:-}
      SmartAccounts__ConsentValidDays: ${SMARTACCOUNTS_CONSENT_VALID_DAYS:-180}
      SmartAccounts__InitialHistoryDays: ${SMARTACCOUNTS_INITIAL_HISTORY_DAYS:-365}
      SmartAccounts__MaxTransactionPages: ${SMARTACCOUNTS_MAX_TRANSACTION_PAGES:-50}

      # ─── Casa de marcat cloud (FiscalLink) ──────────────────────────────────────────────
      FiscalLink__ManagementKey: ${FISCALLINK_MANAGEMENT_KEY:-}
      FiscalLink__CommandKey: ${FISCALLINK_COMMAND_KEY:-}

      # ─── Eldrive ────────────────────────────────────────────────────────────────────────
      Eldrive__ApiKey: ${ELDRIVE_API_KEY:-}
      Eldrive__PartnerId: ${ELDRIVE_PARTNER_ID:-1452}

      # ─── SMS ────────────────────────────────────────────────────────────────────────────
      Sms__ApiKey: ${SMS_API_KEY:-}
      Sms__ApiSecret: ${SMS_API_SECRET:-}
      Sms__From: ${SMS_FROM:-}

      # ─── Notificări push (Web Push / VAPID) ─────────────────────────────────────────────
      WebPush__PublicKey: ${WEBPUSH_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${WEBPUSH_PRIVATE_KEY:-}
      WebPush__Subject: ${WEBPUSH_SUBJECT:-mailto:contact@ridelance.ro}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    volumes:
      - backend-uploads:/app/uploads
    restart: unless-stopped

  frontend:
    image: cezarique/ridelance-frontend:${FRONTEND_TAG:-sha-9d82b8d8b022}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  postgres-data:
  backend-uploads:
