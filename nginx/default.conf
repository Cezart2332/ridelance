server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx:stable nu are `.mjs` în mime.types și îl trimite ca application/octet-stream, pe care
    # browserul îl refuză ca modul (worker-ul pdf.js). `types` aici acoperă doar fișierele `.mjs`.
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Versiunea build-ului: frontend-ul o citește ca să afle de un deploy nou.
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Hashed build assets — never SPA-fallback (404 must stay 404, not index.html)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Shell — always fetch fresh so users pick up new chunk hashes
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
