# Un fișier din /assets/ care lipsește (cerut în secundele unui deploy, de la containerul vechi) nu se
# păstrează în cache: altfel Cloudflare și browserul țin 404-ul și pagina rămâne albă după deploy.
map $status $assets_cache_control {
    200     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-store";
}

# Paginile HTML (cele pre-randate și pagina de pornire) se cer mereu proaspete: ele numesc
# fișierele cu hash ale build-ului curent. Restul fișierelor din rădăcină rămân fără antet.
map $uri $html_cache_control {
    ~\.html$ "no-cache, no-store, must-revalidate";
    default  "";
}

# Calea cerută de browser, fără interogare. `$uri` nu e bun aici: se schimbă la fiecare
# redirecționare internă, iar întrebarea pusă API-ului e despre adresa din bara browserului.
map $request_uri $page_path {
    ~^(?<path_only>[^?]*) $path_only;
    default               /;
}

# Backendul, pe numele lui din rețeaua Docker. Într-o variabilă dinadins: așa nginx îl caută la
# fiecare cerere, prin DNS-ul rețelei, și pornește și când backendul lipsește (imaginea rulată
# singură, în CI).
map "" $api_upstream {
    default http://backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s ipv6=off;
    # Cât backendul e oprit (un deploy), numele lui nu se rezolvă; nu așteptăm după el.
    resolver_timeout 2s;

    # Redirecționările pleacă relative: în fața nginx-ului stă un proxy care termină TLS, iar o
    # adresă absolută construită aici ar începe cu „http://”.
    absolute_redirect off;

    # „/servicii/” și „/servicii” sunt aceeași pagină; rămâne o singură adresă.
    # Doar căi din litere, cifre, cratime și puncte: un „\” ajuns în adresa de redirecționare ar fi
    # citit de browser ca început de alt domeniu.
    rewrite ^/([A-Za-z0-9_-][A-Za-z0-9_./-]*)/$ /$1 permanent;

    include /etc/nginx/conf.d/security-headers.inc;

    # nginx:stable nu are `.mjs` în mime.types și îl trimite ca application/octet-stream, pe care
    # browserul îl refuză ca modul (worker-ul pdf.js). `types` aici acoperă doar fișierele `.mjs`.
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Versiunea build-ului: frontend-ul o citește ca să afle de un deploy nou.
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    # Hashed build assets — never SPA-fallback (404 must stay 404, not index.html)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $assets_cache_control always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Fișierele pentru crawlere există sau nu există; nu cad niciodată pe pagina aplicației, care
    # ar răspunde 200 cu HTML la o cerere de XML.
    location = /robots.txt {
        try_files $uri =404;
    }
    location ~ ^/sitemap[^/]*\.xml$ {
        try_files $uri =404;
    }

    # Sitemap-ul adreselor care vin din date (mașini, pagini de firme) îl generează API-ul.
    # Se servește de aici, ca toate sitemap-urile să stea pe domeniul site-ului.
    location = /sitemap-anunturi.xml {
        proxy_pass $api_upstream/sitemap.xml;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # Fotografiile mașinilor stau la API. Se văd și de aici, ca imaginea de previzualizare a unui
    # anunț distribuit să aibă o adresă pe domeniul site-ului (vezi `GetPageHeadQuery` din backend).
    location /uploads/cars/ {
        proxy_pass $api_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # Adresele vechi, mutate definitiv. Aplicația le redirecționează și ea, dar abia în browser;
    # de aici pleacă un 301 adevărat, pe care îl înțelege și un crawler.
    location = /intrebari-frecvente  { return 301 /; }
    location = /calculator-taxe      { return 301 /fiscal; }
    location = /programare           { return 301 /contact; }
    location = /parteneri/bcr/oferte { return 301 /parteneri/bcr; }

    # Pagina principală pre-randată — mereu proaspătă, ca să aducă hash-urile build-ului curent.
    # Rădăcina are blocul ei: `try_files $uri` din `location /` nu potrivește un director.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Pagina goală de pornire și varianta ei pentru paginile din date: se servesc doar dinăuntru.
    location = /shell.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }
    location = /dynamic-page.html {
        internal;
    }

    # Zonele aplicației: conturi, onboarding, plată, linkuri cu token. Există mereu și n-au nimic
    # de aflat de la API înainte să pornească, deci primesc direct pagina de pornire.
    #
    # Lista e în oglindă cu rutele de prim nivel din `src/App.tsx`. O zonă uitată aici tot merge:
    # ajunge la `@page`, iar API-ul o recunoaște după `CompanySlug.Reserved`.
    location ~ ^/(app|admin|contabil|onboarding|onboarding-srl|poster|autentificare|inregistrare|confirmare-email|parola-uitata|checkout|banca|semneaza|invitatie|demo|dev|auth|dashboard|dashboard-demo)(/|$) {
        try_files /shell.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Paginile partenerilor sunt toate pre-randate; un partener care nu există duce la listă.
    location ^~ /parteneri/ {
        try_files $uri.html @partner_missing;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }
    location @partner_missing {
        return 302 /parteneri;
    }

    # Fișierul cerut; altfel pagina pre-randată la build (`/servicii` → `/servicii.html`, vezi
    # scripts/prerender.mjs); altfel o pagină care depinde de date.
    location / {
        try_files $uri $uri.html @page;
        add_header Cache-Control $html_cache_control;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # O adresă care nu e nici fișier, nici zonă a aplicației: o mașină, pagina unei firme sau nimic.
    # Doar API-ul știe care, așa că e întrebat înainte de răspuns (`/_seo/exists`):
    #
    #   - există  → pagina de pornire cu titlul, descrierea și imaginea ei puse în <head> (`/_seo/head`);
    #   - nu există → aceeași pagină de pornire, dar cu 404. Aplicația pornește oricum și își arată
    #     ecranul de „pagină negăsită”; diferența e că și un crawler află că aici nu e nimic;
    #   - API-ul nu răspunde → pagina de pornire, cu 200, ca până acum. Site-ul nu cade odată cu el.
    location @page {
        auth_request /_seo/exists;
        error_page 403 =404 /shell.html;
        error_page 500 =200 /shell.html;

        ssi on;
        try_files /dynamic-page.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # `auth_request` înțelege doar „da” (2xx) și „nu” (401/403); orice altceva e pentru el o eroare.
    # De aceea 404-ul API-ului devine aici 403, iar căderea API-ului rămâne eroare (500 mai sus).
    location = /_seo/exists {
        internal;
        proxy_pass $api_upstream/seo/head?path=$page_path;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 = @seo_missing;
    }
    location @seo_missing {
        return 403;
    }

    # Etichetele paginii, incluse în `dynamic-page.html`. Fără răspuns (sau cu unul gol, pentru o
    # pagină a aplicației) rămân titlul și descrierea implicite din blocul de rezervă al paginii.
    location = /_seo/head {
        internal;
        proxy_pass $api_upstream/seo/head?path=$page_path;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Un răspuns comprimat nu poate fi inclus în pagină.
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @seo_none;
    }
    location @seo_none {
        return 204;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
