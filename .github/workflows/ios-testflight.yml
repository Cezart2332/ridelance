# Aplicația iOS → TestFlight, fără Mac: build pe un runner macOS de la GitHub.
#
# Semnarea e „cloud managed”: Xcode primește o cheie API App Store Connect și își creează singur
# certificatul și profilul de distribuție. Nu există certificate .p12 de exportat de pe un Mac.
#
# Secretele necesare (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID        — Team ID din developer.apple.com → Membership
#   ASC_KEY_ID           — Key ID-ul cheii API din App Store Connect
#   ASC_ISSUER_ID        — Issuer ID-ul de deasupra listei de chei
#   ASC_KEY_P8           — conținutul fișierului AuthKey_XXXX.p8, copiat întreg
#   VITE_MAPBOX_TOKEN    — opțional; fără el hărțile din aplicație nu se încarcă
#
# Cheia API trebuie să aibă rolul Admin: doar așa poate crea certificatul de distribuție.

name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versiunea afișată (ex. 0.1.0). Numărul de build crește automat.
        required: true
        default: 0.1.0

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      MARKETING_VERSION: ${{ inputs.version }}
      # Crește la fiecare rulare: App Store Connect refuză un build cu număr deja urcat.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Verifică secretele
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Lipsesc secretele: ${missing[*]}"
            exit 1
          fi
          if ! [[ "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Versiunea trebuie să fie de forma 1.2.3, nu „$MARKETING_VERSION”."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalează dependențele
        run: npm ci

      - name: Build aplicație (mod nativ) și copiere în proiectul iOS
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: |
          npm run build:native
          npx cap sync ios

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cheia API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Arhivează
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Exportă și urcă în TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### Build $MARKETING_VERSION ($BUILD_NUMBER) urcat în App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "Apare în TestFlight după procesare, de obicei în 10–30 de minute." >> "$GITHUB_STEP_SUMMARY"

      - name: Șterge cheia API
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
